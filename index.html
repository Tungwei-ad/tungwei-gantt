<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東煒建設 專案時程管理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8F%97%EF%B8%8F</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    color-scheme: light;
    --page-bg:#f9f9f7;
    --surface:#fcfcfb;
    --surface-2:#f1f0ea;
    --ink:#0b0b0b;
    --ink-2:#52514e;
    --ink-muted:#898781;
    --gridline:#e1e0d9;
    --baseline:#c3c2b7;
    --border:rgba(11,11,11,0.10);
    --accent:#2a78d6;
    --accent-ink:#ffffff;
    --cat-sale:#2a78d6;
    --cat-lease:#eb6834;
    --cat-self:#1baf7a;
    --cat-other:#e87ba4;
    --danger:#d03b3b;
    --danger-ink:#ffffff;
    --today-line:#0b0b0b;
    --status-good:#0ca30c;
    --shadow: 0 1px 2px rgba(11,11,11,0.06), 0 8px 24px rgba(11,11,11,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --page-bg:#0d0d0d;
      --surface:#1a1a19;
      --surface-2:#212120;
      --ink:#ffffff;
      --ink-2:#c3c2b7;
      --ink-muted:#8f8d87;
      --gridline:#2c2c2a;
      --baseline:#3a3a37;
      --border:rgba(255,255,255,0.12);
      --accent:#3987e5;
      --accent-ink:#0b0b0b;
      --cat-sale:#3987e5;
      --cat-lease:#d95926;
      --cat-self:#199e70;
      --cat-other:#d55181;
      --danger:#e66767;
      --danger-ink:#1a1a19;
      --today-line:#ffffff;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page-bg:#0d0d0d;
    --surface:#1a1a19;
    --surface-2:#212120;
    --ink:#ffffff;
    --ink-2:#c3c2b7;
    --ink-muted:#8f8d87;
    --gridline:#2c2c2a;
    --baseline:#3a3a37;
    --border:rgba(255,255,255,0.12);
    --accent:#3987e5;
    --accent-ink:#0b0b0b;
    --cat-sale:#3987e5;
    --cat-lease:#d95926;
    --cat-self:#199e70;
    --cat-other:#d55181;
    --danger:#e66767;
    --danger-ink:#1a1a19;
    --today-line:#ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --page-bg:#f9f9f7;
    --surface:#fcfcfb;
    --surface-2:#f1f0ea;
    --ink:#0b0b0b;
    --ink-2:#52514e;
    --ink-muted:#898781;
    --gridline:#e1e0d9;
    --baseline:#c3c2b7;
    --border:rgba(11,11,11,0.10);
    --accent:#2a78d6;
    --accent-ink:#ffffff;
    --cat-sale:#2a78d6;
    --cat-lease:#eb6834;
    --cat-self:#1baf7a;
    --cat-other:#e87ba4;
    --danger:#d03b3b;
    --danger-ink:#ffffff;
    --today-line:#0b0b0b;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--page-bg);
    color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei UI", "Microsoft JhengHei", sans-serif;
    font-size:13.5px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .mono{
    font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, "Noto Sans Mono CJK TC", monospace;
    font-variant-numeric: tabular-nums;
  }
  a{color:inherit;}
  button{font:inherit;}
  ::selection{background:color-mix(in srgb, var(--accent) 30%, transparent);}

  .app{
    max-width:1400px;
    margin:0 auto;
    padding:28px 28px 56px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  /* ---------- Header ---------- */
  .app-header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--border);
    padding-bottom:16px;
  }
  .brand-mark{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .brand-eyebrow{
    font-size:11px;
    font-weight:600;
    letter-spacing:0.12em;
    color:var(--ink-muted);
    text-transform:uppercase;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .brand-title{
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.01em;
    text-wrap:balance;
  }
  .btn{
    appearance:none;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    padding:9px 16px;
    border-radius:7px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:background .12s ease, border-color .12s ease, transform .06s ease;
  }
  .btn:hover{background:var(--surface-2);}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{
    border-color:transparent;
    background:transparent;
    padding:6px 10px;
    font-weight:500;
  }
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger-text{color:var(--danger);}
  .btn-sm{padding:5px 10px; font-size:12px; border-radius:6px;}

  /* ---------- Controls ---------- */
  .controls{
    display:flex;
    align-items:center;
    gap:22px;
    flex-wrap:wrap;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 18px;
    box-shadow:var(--shadow);
  }
  .control-group{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .control-label{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-muted);
    white-space:nowrap;
  }
  input[type="month"], input[type="text"], input[type="number"], select, textarea{
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size:13px;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    padding:6px 9px;
  }
  input[type="text"], select, textarea{font-family: inherit;}
  input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .range-sep{color:var(--ink-muted); font-size:12px;}
  .preset-row{display:flex; gap:6px;}
  .chip{
    border:1px solid var(--border);
    background:transparent;
    color:var(--ink-2);
    padding:5px 11px;
    border-radius:999px;
    font-size:12px;
    cursor:pointer;
  }
  .chip:hover{background:var(--surface-2);}
  .chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
  .count-readout{
    margin-left:auto;
    font-size:12px;
    color:var(--ink-muted);
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .count-readout b{color:var(--ink); font-weight:700;}

  /* ---------- View tabs ---------- */
  .view-tabs{
    display:flex;
    gap:22px;
    border-bottom:1px solid var(--border);
    margin-bottom:-4px;
  }
  .view-tab{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--ink-muted);
    font-size:13.5px;
    font-weight:600;
    padding:9px 2px 10px;
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .view-tab:hover{color:var(--ink-2);}
  .view-tab.active{color:var(--ink); border-bottom-color:var(--accent);}
  .view-tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  #gantt-view, #cards-view{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  #gantt-view[hidden], #cards-view[hidden]{
    display:none;
  }

  /* ---------- Cards view ---------- */
  .cards-toolbar{display:flex; align-items:center;}
  #cards-sections{display:flex; flex-direction:column; gap:28px;}
  .card-section{display:flex; flex-direction:column; gap:12px;}
  .card-section-heading{
    font-size:12px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-muted);
    padding-bottom:8px;
    border-bottom:1px solid var(--border);
  }
  .cards-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(272px, 1fr));
    gap:14px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px 18px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .card-head{display:flex; flex-direction:column; gap:8px;}
  .card-name{font-size:15px; font-weight:700; text-wrap:balance;}
  .card-badges{display:flex; gap:6px; flex-wrap:wrap;}
  .card-facts{
    display:flex;
    flex-direction:column;
    gap:5px;
    padding:11px 0;
    border-top:1px solid var(--gridline);
    border-bottom:1px solid var(--gridline);
  }
  .card-fact{display:flex; justify-content:space-between; gap:10px; font-size:12px;}
  .card-fact-k{color:var(--ink-muted);}
  .card-fact-v{color:var(--ink-2); font-weight:600;}
  .card-progress{display:flex; flex-direction:column; gap:6px;}
  .progress-label-row{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-2);}
  .progress-track{height:6px; border-radius:999px; background:var(--gridline); overflow:hidden;}
  .progress-fill{height:100%; border-radius:999px;}
  .card-notes{
    font-size:12px;
    color:var(--ink-muted);
    border-top:1px solid var(--gridline);
    padding-top:10px;
  }

  /* ---------- Legend ---------- */
  .legend{
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
    font-size:12px;
    color:var(--ink-2);
    padding:0 2px;
  }
  .legend-group{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .legend-item{display:flex; align-items:center; gap:6px;}
  .swatch{width:12px; height:12px; border-radius:3px; flex:none;}
  .legend-divider{width:1px; height:14px; background:var(--border);}
  .diamond{
    width:8px; height:8px;
    transform:rotate(45deg);
    background:var(--ink-muted);
    flex:none;
  }
  .diamond.outline{background:transparent; border:1.5px solid var(--ink-muted);}
  .today-swatch{
    width:14px; height:0; border-top:2px dashed var(--today-line); flex:none;
  }

  /* ---------- Storage banner ---------- */
  .banner{
    font-size:12px;
    color:var(--ink-muted);
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 14px;
    display:none;
  }
  .banner.show{display:block;}

  /* ---------- Gantt ---------- */
  .gantt-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .gantt-scroll{
    overflow-x:auto;
    overflow-y:visible;
    position:relative;
  }
  .gantt-grid{
    display:grid;
    position:relative;
  }
  .head-corner{
    position:sticky;
    top:0; left:0;
    z-index:6;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
    grid-row:1 / 3;
    grid-column:1;
    display:flex;
    align-items:flex-end;
    padding:8px 14px 10px;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-muted);
  }
  .head-year{
    position:sticky;
    top:0;
    z-index:4;
    background:var(--surface-2);
    border-bottom:1px solid var(--gridline);
    border-right:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size:12px;
    font-weight:700;
    color:var(--ink-2);
    padding:3px 0;
  }
  .head-month{
    position:sticky;
    top:24px;
    z-index:4;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size:10.5px;
    color:var(--ink-muted);
    padding:4px 0;
  }
  .head-month.jan{color:var(--ink-2); font-weight:700;}
  .row-label{
    position:sticky;
    left:0;
    z-index:5;
    background:var(--surface);
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--gridline);
    padding:9px 14px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:5px;
    min-height:64px;
  }
  .row:nth-child(odd) .row-label, .row-band-odd{ background:var(--surface); }
  .row-band{
    grid-column: 2 / -1;
    border-bottom:1px solid var(--gridline);
  }
  .row-band-even{background:color-mix(in srgb, var(--surface-2) 45%, transparent);}
  .section-band{
    background:var(--surface-2);
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
  }
  .section-label{
    position:sticky;
    left:0;
    z-index:5;
    background:var(--surface-2);
    border-right:1px solid var(--border);
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:5px 14px;
    display:flex;
    align-items:center;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-muted);
  }
  .row-name-line{
    display:flex;
    align-items:center;
    gap:7px;
  }
  .drag-handle{
    cursor:grab;
    color:var(--ink-muted);
    font-size:14px;
    line-height:1;
    user-select:none;
    touch-action:none;
    flex:none;
  }
  .drag-handle:active{cursor:grabbing;}
  .row-label.dragging-row{opacity:0.4;}
  .row-label.drag-over-top{box-shadow:inset 0 2px 0 var(--accent);}
  .row-label.drag-over-bottom{box-shadow:inset 0 -2px 0 var(--accent);}
  .row-name{
    font-size:13.5px;
    font-weight:700;
    color:var(--ink);
    text-wrap:balance;
  }
  .row-meta{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .badge{
    font-size:10.5px;
    font-weight:700;
    padding:2px 7px;
    border-radius:999px;
    letter-spacing:0.02em;
    color:#fff;
    white-space:nowrap;
  }
  .badge-outline{
    font-size:10.5px;
    font-weight:600;
    padding:1.5px 7px;
    border-radius:999px;
    border:1px solid var(--border);
    color:var(--ink-2);
    white-space:nowrap;
  }
  .badge-stage-done{
    font-size:10.5px;
    font-weight:700;
    padding:1.5px 7px;
    border-radius:999px;
    border:1px solid color-mix(in srgb, var(--status-good) 45%, transparent);
    color:var(--status-good);
    white-space:nowrap;
  }
  .row-progress{
    font-size:11px;
    color:var(--ink-muted);
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .row-actions, .card-actions{
    display:flex; gap:2px; margin-top:2px;
  }
  .empty-state{
    padding:48px 24px;
    text-align:center;
    color:var(--ink-muted);
    font-size:13px;
  }

  /* bars & markers (positioned as grid children) */
  .bar{
    align-self:center;
    height:20px;
    border-radius:4px;
    position:relative;
    display:flex;
    align-items:center;
    z-index:1;
    min-width:4px;
  }
  .bar-build{
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
    cursor:grab;
    touch-action:none;
  }
  .bar-build.dragging{
    cursor:grabbing;
    box-shadow: 0 0 0 2px var(--accent);
  }
  .bar-handle{
    position:absolute;
    top:0; bottom:0;
    width:8px;
    cursor:ew-resize;
  }
  .bar-handle-l{left:0;}
  .bar-handle-r{right:0;}
  .bar-drag-tip{
    position:absolute;
    left:50%;
    top:-24px;
    transform:translateX(-50%);
    background:var(--ink);
    color:var(--surface);
    font-size:10.5px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    padding:2px 7px;
    border-radius:4px;
    white-space:nowrap;
    pointer-events:none;
    z-index:10;
  }
  .bar-op{
    height:10px;
    align-self:center;
    border-radius:3px;
    opacity:0.35;
    z-index:1;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.35) 0, rgba(255,255,255,0.35) 2px, transparent 2px, transparent 6px);
  }
  .bar-lease{
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06), 0 0 0 2px var(--surface);
    cursor:grab;
    touch-action:none;
  }
  .bar-lease.dragging{
    cursor:grabbing;
    box-shadow: 0 0 0 2px var(--status-good);
  }
  .bar-label{
    position:absolute;
    left:calc(100% + 7px);
    top:50%;
    transform:translateY(-50%);
    font-size:11px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    color:var(--ink-2);
    white-space:nowrap;
    pointer-events:none;
  }
  .marker{
    align-self:center;
    justify-self:center;
    z-index:2;
    cursor:default;
  }
  .marker-diamond{
    width:10px; height:10px;
    transform:rotate(45deg);
    background:var(--ink-2);
    border:2px solid var(--surface);
  }
  .marker-diamond.permit{
    background:var(--surface);
    border:2px solid var(--ink-muted);
  }
  .year-divider{
    grid-row: 1 / -1;
    border-left:1px solid var(--border);
    z-index:1;
    pointer-events:none;
  }
  .today-line{
    grid-row:1 / -1;
    border-left:2px dashed var(--today-line);
    z-index:3;
    pointer-events:none;
    position:relative;
  }
  .today-tag{
    position:sticky;
    top:48px;
    display:inline-block;
    background:var(--today-line);
    color:var(--surface);
    font-size:9.5px;
    font-weight:700;
    padding:1px 5px;
    border-radius:3px;
    transform:translateX(-50%);
    white-space:nowrap;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }

  [title]{ cursor:help; }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(11,11,11,0.45);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    overflow:auto;
    z-index:50;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    width:100%;
    max-width:560px;
    padding:24px 26px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .modal h2{
    margin:0 0 4px;
    font-size:17px;
    font-weight:700;
  }
  .modal-sub{
    margin:0 0 18px;
    font-size:12px;
    color:var(--ink-muted);
  }
  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 16px;
  }
  .field{display:flex; flex-direction:column; gap:5px;}
  .field.span-2{grid-column:1 / -1;}
  .field label{
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-2);
  }
  .field .hint{font-size:10.5px; color:var(--ink-muted); font-weight:400;}
  .field-error{font-size:11px; color:var(--danger); min-height:14px;}
  .pct-wrap{display:flex; align-items:center; gap:8px;}
  .pct-wrap input[type=range]{flex:1; accent-color:var(--accent);}
  .pct-value{font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size:12.5px; width:38px; text-align:right;}
  .input-with-btn{display:flex; gap:6px;}
  .input-with-btn input{flex:1; min-width:0;}
  .btn-inline{
    appearance:none;
    border:1px solid var(--border);

    font-size:11.5px;
    font-weight:600;

  .lease-row{display:flex; gap:14px; flex-wrap:wrap;}

  }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="brand-mark">
      <span class="brand-eyebrow">東煒建設 · TUNGWEI Development</span>
      <h1 class="brand-title">開發案時程總覽</h1>
    </div>
    <button class="btn btn-primary" id="btn-add">＋ 新增專案</button>
  </header>

  <div class="banner" id="storage-banner"></div>

  <div class="view-tabs" role="tablist" aria-label="檢視模式">
    <button class="view-tab active" type="button" data-view="gantt" role="tab" aria-selected="true">甘特圖</button>
    <button class="view-tab" type="button" data-view="cards" role="tab" aria-selected="false">專案卡片</button>
  </div>

  <div id="gantt-view">
    <section class="controls" aria-label="甘特圖檢視區間設定">
      <div class="control-group">
        <span class="control-label">檢視區間</span>
        <input type="month" id="range-from">
        <span class="range-sep">至</span>
        <input type="month" id="range-to">
      </div>
      <div class="preset-row" id="preset-row">
        <button class="chip" data-preset="all">全部案件</button>
        <button class="chip" data-preset="year">今年</button>
        <button class="chip" data-preset="next3">未來 3 年</button>
      </div>
      <div class="control-group">
        <span class="control-label">時間刻度</span>
        <div class="preset-row" id="granularity-row">
          <button class="chip active" data-granularity="month">月</button>
          <button class="chip" data-granularity="year">年</button>
        </div>
      </div>
      <span class="count-readout" id="count-readout"></span>
    </section>

    <div class="legend">
      <span class="control-label" style="color:var(--ink-muted)">圖例</span>
      <div class="legend-group" id="legend-modes"></div>
      <div class="legend-divider"></div>
      <div class="legend-group">
        <span class="legend-item"><span class="diamond outline"></span>取得建照</span>
        <span class="legend-item"><span class="diamond"></span>開工（興建期起點）</span>
        <span class="legend-item"><span class="today-swatch"></span>今日</span>
      </div>
    </div>

    <div class="gantt-card">
      <div class="gantt-scroll" id="gantt-scroll">
        <div class="gantt-grid" id="gantt-grid"></div>
      </div>
    </div>
  </div>

  <div id="cards-view" hidden>
    <div class="cards-toolbar">
      <span class="count-readout" id="cards-count"></span>
    </div>
    <div id="cards-sections"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">新增專案</h2>
    <p class="modal-sub">開工時間即視為興建期起點；如取得建照時間未定可留空。</p>
    <form id="project-form">
      <div class="form-grid">
        <div class="field span-2">
          <label for="f-name">案名 *</label>
          <input type="text" id="f-name" maxlength="60" placeholder="例：頭興段" required>
          <div class="field-error" id="err-name"></div>
        </div>

        <div class="field">
          <label for="f-type">本案類型 *</label>
          <select id="f-type">
            <option value="廠辦">廠辦</option>
            <option value="住宅">住宅</option>
            <option value="商辦">商辦</option>
            <option value="廠房">廠房</option>
            <option value="社宅">社宅</option>
            <option value="其他">其他（自訂）</option>
          </select>
        </div>
        <div class="field" id="wrap-type-other" style="display:none;">
          <label for="f-type-other">自訂類型</label>
          <input type="text" id="f-type-other" maxlength="20" placeholder="輸入類型名稱">
        </div>

        <div class="field">
          <label for="f-stage">案件階段 *</label>
          <select id="f-stage">
            <option value="開發期">開發期</option>
            <option value="完成開發">完成開發</option>
          </select>
          <span class="hint">完成開發後可填入出租的租期，追蹤到期日</span>
        </div>
        <div class="field">
          <label for="f-permit">取得建照時間</label>
          <input type="month" id="f-permit">
        </div>

        <div class="field">
          <label for="f-start"><span id="label-start">興建期起（開工）*</span></label>
          <div class="input-with-btn">
            <input type="month" id="f-start">
            <button type="button" class="btn-inline" id="btn-today-start">今天</button>
          </div>
          <span class="hint" id="hint-build" style="display:none;">完成開發的案件可留空</span>
        </div>
        <div class="field">
          <label for="f-end"><span id="label-end">興建期迄 *</span></label>
          <input type="month" id="f-end">
          <div class="field-error" id="err-range"></div>
        </div>

        <div class="field">
          <label for="f-mode">資產營運方式 *</label>
          <select id="f-mode">
            <option value="出售">出售</option>
            <option value="出租">出租</option>
            <option value="自營">自營</option>
            <option value="其他">其他（自訂）</option>
          </select>
        </div>
        <div class="field" id="wrap-mode-other" style="display:none;">
          <label for="f-mode-other">自訂營運方式</label>
          <input type="text" id="f-mode-other" maxlength="20" placeholder="輸入營運方式">
        </div>

        <div class="field span-2" id="wrap-lease" style="display:none;">
          <label>出租租期（完成開發後追蹤到期日用）</label>
          <div class="lease-row">
            <div class="lease-field">
              <span class="hint">出租起始日</span>
              <div class="input-with-btn">
                <input type="date" id="f-lease-start">
                <button type="button" class="btn-inline" id="btn-today-lease">今天</button>
              </div>
            </div>
            <div class="lease-field">
              <span class="hint">到期日</span>
              <input type="date" id="f-lease-end">
            </div>
          </div>
          <div class="field-error" id="err-lease"></div>
        </div>

        <div class="field span-2">
          <label for="f-progress"><span id="progress-label">出售比例</span></label>
          <div class="pct-wrap">
            <input type="range" id="f-progress" min="0" max="100" step="1" value="0">
            <span class="pct-value mono" id="f-progress-value">0%</span>
          </div>
        </div>

        <div class="field span-2">
          <label for="f-notes">備註</label>
          <textarea id="f-notes" rows="2" maxlength="200" placeholder="選填"></textarea>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn" id="btn-cancel">取消</button>
        <button type="submit" class="btn btn-primary" id="btn-save">儲存</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ================= date utils ================= */
  function todayKey(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  }
  function todayDateKey(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function splitKey(k){ const [y,m] = k.split("-").map(Number); return {y,m}; }
  function addMonths(key, n){
    let {y,m} = splitKey(key);
    m += n;
    y += Math.floor((m-1)/12);
    m = ((m-1)%12+12)%12+1;
    return y + "-" + String(m).padStart(2,"0");
  }
  function addPeriod(key, n){ // shift by n columns, respecting current granularity; preserves a day segment if present
    const parts = key.split("-");
    let y = Number(parts[0]), m = Number(parts[1]);
    const day = parts[2];
    if (granularity === "year"){
      y += n;
    } else {
      m += n;
      y += Math.floor((m-1)/12);
      m = ((m-1)%12+12)%12+1;
    }
    const ym = y + "-" + String(m).padStart(2,"0");
    return day !== undefined ? (ym + "-" + day) : ym;
  }
  function monthsBetween(a, b){ // a - b, in months
    const A = splitKey(a), B = splitKey(b);
    return (A.y-B.y)*12 + (A.m-B.m);
  }
  function formatYM(k){
    const {y,m} = splitKey(k);
    return y + "/" + String(m).padStart(2,"0");
  }
  function formatDate(k){
    if (!k) return "";
    const parts = k.split("-");
    if (parts.length >= 3) return parts[0] + "/" + parts[1] + "/" + parts[2];
    return formatYM(k);
  }
  function buildMonthsList(from, to){
    const out = [];
    let cur = from, guard = 0;
    while (cur <= to && guard < 1000){
      const {y,m} = splitKey(cur);
      out.push({key:cur, y, m});
      cur = addMonths(cur, 1);
      guard++;
    }
    return out;
  }

  /* ================= category styling ================= */
  const MODE_COLOR_VAR = {
    "出售":"--cat-sale",
    "出租":"--cat-lease",
    "自營":"--cat-self"
  };
  function modeColorVar(mode){ return MODE_COLOR_VAR[mode] || "--cat-other"; }
  function progressLabelFor(mode){
    if (mode === "出售") return "出售比例";
    if (mode === "出租") return "出租率";
    if (mode === "自營") return "使用率";
    return "營運進度";
  }
  /* ================= state ================= */
  let projects = [];           // {id, name, type, typeOther, permitMonth, buildStart, buildEnd, operationMode, operationModeOther, operationProgress, notes}
  let range = { from: null, to: null };
  let editingId = null;
  let dbApi = null, hasSeeded = false;
  let pendingDeleteId = null;
  let viewMode = "gantt"; // "gantt" | "cards"
  let granularity = "month"; // "month" | "year"
  let draggingRowId = null;

  const SEED = {
    name:"頭興段",
    type:"廠辦", typeOther:"",
    stage:"開發期",
    permitMonth:"2025-12",
    buildStart:"2026-06",
    buildEnd:"2028-12",
    operationMode:"出售", operationModeOther:"",
    operationProgress:0,
    leaseStart:"", leaseEnd:"",
    notes:"",
    order:0
  };

  function byOrder(a, b){ return (a.order ?? 0) - (b.order ?? 0); }

  function reorderProject(draggedId, targetId, insertAfter){
    const list = projects.slice().sort(byOrder);
    const targetIdx = list.findIndex(p => p.id === targetId);
    if (targetIdx === -1 || draggedId === targetId) return;
    const filtered = list.filter(p => p.id !== draggedId);
    const targetIdxInFiltered = filtered.findIndex(p => p.id === targetId);
    const insertIdx = targetIdxInFiltered + (insertAfter ? 1 : 0);
    const prev = filtered[insertIdx - 1];
    const next = filtered[insertIdx];
    let newOrder;
    if (prev && next) newOrder = ((prev.order ?? 0) + (next.order ?? 0)) / 2;
    else if (prev) newOrder = (prev.order ?? 0) + 1;
    else if (next) newOrder = (next.order ?? 0) - 1;
    else newOrder = 0;
    saveProject(draggedId, { order: newOrder });
  }

  /* ================= storage layer (Supabase, public + shared) ================= */
  const SUPABASE_URL = "https://cykdmfewgoacaynxhbfy.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5a2RtZmV3Z29hY2F5bnhoYmZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NTQ5OTIsImV4cCI6MjA5ODQzMDk5Mn0.TrTnvBB4Q13tc1TMGzRIzW3ZyX0NWtEnvlq3-eUxtI0";
  const TABLE = "gantt_projects";

  function toDbRow(data){
    const map = {
      name:"name", type:"type", typeOther:"type_other", stage:"stage",
      permitMonth:"permit_month", buildStart:"build_start", buildEnd:"build_end",
      operationMode:"operation_mode", operationModeOther:"operation_mode_other",
      leaseStart:"lease_start", leaseEnd:"lease_end",
      operationProgress:"operation_progress", notes:"notes", order:"sort_order"
    };
    const row = {};
    Object.keys(data).forEach(k => { if (map[k]) row[map[k]] = data[k]; });
    return row;
  }
  function fromDbRow(row){
    return {
      id: row.id, name: row.name, type: row.type, typeOther: row.type_other,
      stage: row.stage, permitMonth: row.permit_month,
      buildStart: row.build_start, buildEnd: row.build_end,
      operationMode: row.operation_mode, operationModeOther: row.operation_mode_other,
      leaseStart: row.lease_start, leaseEnd: row.lease_end,
      operationProgress: row.operation_progress, notes: row.notes,
      order: row.sort_order
    };
  }

  async function initStorage(){
    if (!window.supabase || typeof window.supabase.createClient !== "function"){
      showBanner("資料庫程式庫載入失敗，請檢查網路連線並重新整理頁面。");
      return;
    }
    dbApi = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    await refreshProjects();
    dbApi
      .channel(TABLE + "_changes")
      .on("postgres_changes", { event: "*", schema: "public", table: TABLE }, () => {
        refreshProjects();
      })
      .subscribe();
  }

  async function refreshProjects(){
    const { data, error } = await dbApi.from(TABLE).select("*").order("sort_order");
    if (error){
      console.error(error);
      showBanner("資料讀取失敗，請重新整理頁面再試一次。");
      return;
    }
    if (!data.length && !hasSeeded){
      hasSeeded = true;
      const { error: seedErr } = await dbApi.from(TABLE).insert([toDbRow(SEED)]);
      if (seedErr) console.error(seedErr);
      return; // the insert triggers a realtime change event that re-runs refreshProjects
    }
    projects = data.map(fromDbRow);
    showBanner("");
    onDataChanged();
  }

  function showBanner(text){
    const b = document.getElementById("storage-banner");
    if (!text){ b.classList.remove("show"); b.textContent=""; return; }
    b.textContent = text;
    b.classList.add("show");
  }

  async function createProject(data){
    const { error } = await dbApi.from(TABLE).insert([toDbRow(data)]);
    if (error) throw error;
  }
  async function saveProject(id, data){
    const { error } = await dbApi.from(TABLE).update(toDbRow(data)).eq("id", id);
    if (error) throw error;
  }
  async function removeProject(id){
    const { error } = await dbApi.from(TABLE).delete().eq("id", id);
    if (error) throw error;
  }

  /* ================= range handling ================= */
  function fullExtent(){
    if (!projects.length) return null;
    let min = null, max = null;
    projects.forEach(p => {
      const dates = [p.buildStart, p.buildEnd, p.leaseStart, p.leaseEnd].filter(Boolean);
      if (p.permitMonth) dates.push(p.permitMonth);
      dates.forEach(d => {
        if (min === null || d < min) min = d;
        if (max === null || d > max) max = d;
      });
    });
    return min ? { from: min, to: max } : null;
  }

  function applyPreset(name){
    const tk = todayKey();
    if (name === "all"){
      const ext = fullExtent();
      range = ext ? { from: ext.from, to: ext.to } : { from: addMonths(tk,-3), to: addMonths(tk, 24) };
    } else if (name === "year"){
      const y = splitKey(tk).y;
      range = { from: y + "-01", to: y + "-12" };
    } else if (name === "next3"){
      range = { from: tk, to: addMonths(tk, 36) };
    }
    document.getElementById("range-from").value = range.from;
    document.getElementById("range-to").value = range.to;
    highlightPreset(name);
    renderGantt();
  }
  function highlightPreset(name){
    document.querySelectorAll(".chip").forEach(c => {
      c.classList.toggle("active", c.dataset.preset === name);
    });
  }

  function onDataChanged(){
    if (!range.from || !range.to){
      const ext = fullExtent();
      const tk = todayKey();
      range = ext ? { from: ext.from, to: ext.to } : { from: addMonths(tk,-3), to: addMonths(tk,24) };
      document.getElementById("range-from").value = range.from;
      document.getElementById("range-to").value = range.to;
    }
    render();
  }

  function render(){
    if (viewMode === "gantt"){
      renderLegend();
      renderGantt();
    } else {
      renderCards();
    }
  }

  function setView(mode){
    viewMode = mode;
    document.querySelectorAll(".view-tab").forEach(t => {
      const active = t.dataset.view === mode;
      t.classList.toggle("active", active);
      t.setAttribute("aria-selected", active ? "true" : "false");
    });
    document.getElementById("gantt-view").hidden = mode !== "gantt";
    document.getElementById("cards-view").hidden = mode !== "cards";
    render();
  }
  document.querySelectorAll(".view-tab").forEach(t => {
    t.addEventListener("click", () => setView(t.dataset.view));
  });

  /* ================= visibility & extent per project ================= */
  function projectExtent(p){
    const dates = [p.buildStart, p.buildEnd, p.leaseStart, p.leaseEnd].filter(Boolean);
    if (p.permitMonth) dates.push(p.permitMonth);
    if (!dates.length) return { min: null, max: null };
    return {
      min: dates.reduce((a,b)=> a < b ? a : b),
      max: dates.reduce((a,b)=> a > b ? a : b)
    };
  }
  function isVisible(p, rng){
    const ext = projectExtent(p);
    if (ext.min === null) return false;
    return ext.min <= rng.to && ext.max >= rng.from;
  }
  function modeLabel(p){ return p.operationMode === "其他" ? (p.operationModeOther || "其他") : p.operationMode; }
  function typeLabel(p){ return p.type === "其他" ? (p.typeOther || "其他") : p.type; }

  /* ================= legend ================= */
  function renderLegend(){
    const modesPresent = new Map();
    projects.forEach(p => {
      const label = modeLabel(p);
      const varName = modeColorVar(p.operationMode);
      if (!modesPresent.has(label)) modesPresent.set(label, varName);
    });
    if (!modesPresent.size){
      ["出售","出租","自營"].forEach(m => modesPresent.set(m, modeColorVar(m)));
    }
    const wrap = document.getElementById("legend-modes");
    wrap.innerHTML = "";
    modesPresent.forEach((varName, label) => {
      const item = document.createElement("span");
      item.className = "legend-item";
      const sw = document.createElement("span");
      sw.className = "swatch";
      sw.style.background = "var(" + varName + ")";
      item.appendChild(sw);
      item.appendChild(document.createTextNode(label));
      wrap.appendChild(item);
    });
  }

  /* ================= gantt rendering ================= */
  const MONTH_W = 34;
  const YEAR_W = 64;
  const LABEL_W = 250;

  function buildBuckets(){
    if (granularity === "year"){
      const fromY = splitKey(range.from).y;
      const toY = splitKey(range.to).y;
      const out = [];
      for (let y = fromY; y <= toY; y++) out.push({ key: String(y), y });
      return out;
    }
    return buildMonthsList(range.from, range.to);
  }
  function bucketIndexOf(dateKey){
    if (granularity === "year"){
      return splitKey(dateKey).y - splitKey(range.from).y;
    }
    return monthsBetween(dateKey, range.from);
  }

  function attachBarDrag(bar, p, colWidth, startField, endField){
    startField = startField || "buildStart";
    endField = endField || "buildEnd";
    const fmt = startField === "leaseStart" ? formatDate : formatYM;
    let mode = null; // "move" | "resize-l" | "resize-r"
    let startX = 0;
    let origStart = p[startField], origEnd = p[endField];
    let curStart = origStart, curEnd = origEnd;
    let tip = null;

    function updatePreview(){
      const buckets = buildBuckets();
      const total = buckets.length;
      const rawS = bucketIndexOf(curStart), rawE = bucketIndexOf(curEnd);
      const sIdx = Math.max(0, rawS), eIdx = Math.min(total-1, rawE);
      bar.style.gridColumn = (sIdx+2) + " / " + (eIdx+3);
      if (tip) tip.textContent = fmt(curStart) + " – " + fmt(curEnd);
    }

    function onDown(e){
      if (e.button !== undefined && e.button !== 0) return;
      mode = e.target.classList.contains("bar-handle-l") ? "resize-l"
           : e.target.classList.contains("bar-handle-r") ? "resize-r"
           : "move";
      startX = e.clientX;
      origStart = p[startField]; origEnd = p[endField];
      curStart = origStart; curEnd = origEnd;
      bar.setPointerCapture(e.pointerId);
      bar.classList.add("dragging");
      tip = document.createElement("span");
      tip.className = "bar-drag-tip";
      tip.textContent = fmt(curStart) + " – " + fmt(curEnd);
      bar.appendChild(tip);
      e.preventDefault();
      e.stopPropagation();
    }
    function onMoveEv(e){
      if (!mode) return;
      const dx = e.clientX - startX;
      const deltaCols = Math.round(dx / colWidth);
      if (mode === "move"){
        curStart = addPeriod(origStart, deltaCols);
        curEnd = addPeriod(origEnd, deltaCols);
      } else if (mode === "resize-l"){
        let s = addPeriod(origStart, deltaCols);
        if (s > origEnd) s = origEnd;
        curStart = s; curEnd = origEnd;
      } else {
        let en = addPeriod(origEnd, deltaCols);
        if (en < origStart) en = origStart;
        curStart = origStart; curEnd = en;
      }
      updatePreview();
    }
    function onUp(e){
      if (!mode) return;
      bar.classList.remove("dragging");
      try{ bar.releasePointerCapture(e.pointerId); }catch(err){}
      if (tip){ tip.remove(); tip = null; }
      const changed = curStart !== origStart || curEnd !== origEnd;
      mode = null;
      if (changed){
        saveProject(p.id, { [startField]: curStart, [endField]: curEnd });
      }
    }
    bar.addEventListener("pointerdown", onDown);
    bar.addEventListener("pointermove", onMoveEv);
    bar.addEventListener("pointerup", onUp);
    bar.addEventListener("pointercancel", onUp);
  }

  function clearRowDropMarks(){
    document.querySelectorAll(".row-label").forEach(el => el.classList.remove("drag-over-top","drag-over-bottom"));
  }

  function attachRowDrag(handle, label, p){
    function rowUnderPoint(x, y){
      const el = document.elementFromPoint(x, y);
      return el ? el.closest(".row-label") : null;
    }
    function onDown(e){
      if (e.button !== undefined && e.button !== 0) return;
      handle.setPointerCapture(e.pointerId);
      draggingRowId = p.id;
      label.classList.add("dragging-row");
      e.preventDefault();
      e.stopPropagation();
    }
    function onMove(e){
      if (draggingRowId !== p.id) return;
      clearRowDropMarks();
      const target = rowUnderPoint(e.clientX, e.clientY);
      if (!target || target === label) return;
      const rect = target.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      target.classList.toggle("drag-over-top", before);
      target.classList.toggle("drag-over-bottom", !before);
    }
    function onUp(e){
      if (draggingRowId !== p.id) return;
      try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
      label.classList.remove("dragging-row");
      const target = rowUnderPoint(e.clientX, e.clientY);
      if (target && target !== label && target.dataset.projectId){
        const before = target.classList.contains("drag-over-top");
        reorderProject(p.id, target.dataset.projectId, !before);
      }
      clearRowDropMarks();
      draggingRowId = null;
    }
    handle.addEventListener("pointerdown", onDown);
    handle.addEventListener("pointermove", onMove);
    handle.addEventListener("pointerup", onUp);
    handle.addEventListener("pointercancel", onUp);
  }

  function renderGantt(){
    const grid = document.getElementById("gantt-grid");
    grid.innerHTML = "";
    document.getElementById("count-readout").textContent = "";

    if (!range.from || !range.to || range.from > range.to){
      grid.style.gridTemplateColumns = "1fr";
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "請設定有效的檢視區間。";
      grid.appendChild(empty);
      return;
    }

    const buckets = buildBuckets();
    const visibleProjects = projects.filter(p => isVisible(p, range)).sort(byOrder);
    document.getElementById("count-readout").innerHTML =
      "顯示 <b>" + visibleProjects.length + "</b> / " + projects.length + " 個專案";

    if (!visibleProjects.length){
      grid.style.gridTemplateColumns = "1fr";
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = projects.length
        ? "目前檢視區間內沒有符合的專案。"
        : "尚未建立任何專案，請點選右上角「＋ 新增專案」。";
      grid.appendChild(empty);
      return;
    }

    const isYearMode = granularity === "year";
    const totalCols = buckets.length;
    const colWidth = isYearMode ? YEAR_W : MONTH_W;
    grid.style.gridTemplateColumns = LABEL_W + "px repeat(" + totalCols + ", " + colWidth + "px)";

    const headerRows = 2;
    const subHeaderH = isYearMode ? 0 : 24;
    const rowTemplateParts = ["24px", subHeaderH + "px"];
    const devItems = visibleProjects.filter(p => p.stage !== "完成開發");
    const doneItems = visibleProjects.filter(p => p.stage === "完成開發");
    [devItems, doneItems].forEach(items => {
      if (!items.length) return;
      rowTemplateParts.push("30px");
      items.forEach(() => rowTemplateParts.push("minmax(64px, auto)"));
    });
    grid.style.gridTemplateRows = rowTemplateParts.join(" ");

    // corner
    const corner = document.createElement("div");
    corner.className = "head-corner";
    corner.textContent = "專案";
    grid.appendChild(corner);

    // year header (grouped in month mode; one column each in year mode)
    let ci = 0;
    while (ci < buckets.length){
      const y = buckets[ci].y;
      let span = 0;
      while (ci + span < buckets.length && buckets[ci+span].y === y) span++;
      const yCell = document.createElement("div");
      yCell.className = "head-year";
      yCell.style.gridColumn = (ci+2) + " / " + (ci+2+span);
      yCell.style.gridRow = "1";
      yCell.textContent = y + "年";
      grid.appendChild(yCell);
      ci += span;
    }

    // month sub-header (month mode only)
    if (!isYearMode){
      buckets.forEach((m, i) => {
        const mCell = document.createElement("div");
        mCell.className = "head-month" + (m.m === 1 ? " jan" : "");
        mCell.style.gridColumn = (i+2) + " / " + (i+3);
        mCell.style.gridRow = "2";
        mCell.textContent = m.m;
        grid.appendChild(mCell);
      });

      // year divider lines
      buckets.forEach((m, i) => {
        if (i > 0 && m.m === 1){
          const div = document.createElement("div");
          div.className = "year-divider";
          div.style.gridColumn = (i+2) + " / " + (i+3);
          grid.appendChild(div);
        }
      });
    }

    // row bands + labels
    function renderProjectRow(p, rowNum, zebraIdx){
      const band = document.createElement("div");
      band.className = "row-band" + (zebraIdx % 2 === 1 ? " row-band-even" : "");
      band.style.gridRow = String(rowNum);
      grid.appendChild(band);

      const label = document.createElement("div");
      label.className = "row-label";
      label.style.gridRow = String(rowNum);
      label.style.gridColumn = "1";
      label.dataset.projectId = p.id;

      const nameLine = document.createElement("div");
      nameLine.className = "row-name-line";
      const handle = document.createElement("span");
      handle.className = "drag-handle";
      handle.title = "拖曳調整排序";
      handle.textContent = "⠿";
      nameLine.appendChild(handle);
      const nameEl = document.createElement("div");
      nameEl.className = "row-name";
      nameEl.textContent = p.name;
      nameLine.appendChild(nameEl);
      label.appendChild(nameLine);

      attachRowDrag(handle, label, p);

      const meta = document.createElement("div");
      meta.className = "row-meta";
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.style.background = "var(" + modeColorVar(p.operationMode) + ")";
      badge.textContent = modeLabel(p);
      meta.appendChild(badge);
      const typeBadge = document.createElement("span");
      typeBadge.className = "badge-outline";
      typeBadge.textContent = typeLabel(p);
      meta.appendChild(typeBadge);
      const stageBadge = document.createElement("span");
      stageBadge.className = p.stage === "完成開發" ? "badge-stage-done" : "badge-outline";
      stageBadge.textContent = p.stage === "完成開發" ? "完成開發" : "開發期";
      meta.appendChild(stageBadge);
      label.appendChild(meta);

      const prog = document.createElement("div");
      prog.className = "row-progress";
      prog.textContent = progressLabelFor(p.operationMode) + " " + (p.operationProgress||0) + "%";
      label.appendChild(prog);

      if (p.stage === "完成開發" && p.operationMode === "出租" && p.leaseEnd){
        const leaseInfo = document.createElement("div");
        leaseInfo.className = "row-progress";
        leaseInfo.textContent = "到期日 " + formatDate(p.leaseEnd);
        label.appendChild(leaseInfo);
      }

      const actions = document.createElement("div");
      actions.className = "row-actions";
      const editBtn = document.createElement("button");
      editBtn.className = "btn btn-ghost btn-sm";
      editBtn.type = "button";
      editBtn.textContent = "編輯";
      editBtn.addEventListener("click", () => openModal(p.id));
      const delBtn = document.createElement("button");
      delBtn.className = "btn btn-ghost btn-sm btn-danger-text";
      delBtn.type = "button";
      delBtn.textContent = "刪除";
      delBtn.addEventListener("click", () => confirmDelete(p.id, delBtn));
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      label.appendChild(actions);

      grid.appendChild(label);

      // permit marker
      if (p.permitMonth && p.permitMonth >= range.from && p.permitMonth <= range.to){
        const idx = bucketIndexOf(p.permitMonth);
        const marker = document.createElement("div");
        marker.className = "marker";
        marker.style.gridColumn = (idx+2) + " / " + (idx+3);
        marker.style.gridRow = String(rowNum);
        marker.title = p.name + " · 取得建照 " + formatYM(p.permitMonth);
        const dia = document.createElement("div");
        dia.className = "marker-diamond permit";
        marker.appendChild(dia);
        grid.appendChild(marker);
      }

      // construction bar (clamped)
      const bStart = p.buildStart, bEnd = p.buildEnd;
      const hasLease = p.stage === "完成開發" && p.operationMode === "出租" && p.leaseStart && p.leaseEnd;
      const isDoneOther = p.stage === "完成開發" && p.operationMode !== "出租";
      if (bEnd >= range.from && bStart <= range.to){
        const rawStartIdx = bucketIndexOf(bStart);
        const rawEndIdx = bucketIndexOf(bEnd);
        const startIdx = Math.max(0, rawStartIdx);
        const endIdx = Math.min(totalCols-1, rawEndIdx);
        const bar = document.createElement("div");
        bar.className = "bar bar-build";
        bar.style.gridColumn = (startIdx+2) + " / " + (endIdx+3);
        bar.style.gridRow = String(rowNum);
        bar.style.background = "var(" + modeColorVar(p.operationMode) + ")";
        bar.title = p.name + " · 興建期 " + formatYM(bStart) + " – " + formatYM(bEnd);

        // if this is the true tail end (not clamped) show inline progress label
        if (rawEndIdx <= totalCols-1){
          const lbl = document.createElement("span");
          lbl.className = "bar-label";
          lbl.textContent = (p.operationProgress||0) + "%";
          bar.appendChild(lbl);
        }
        const handleL = document.createElement("span");
        handleL.className = "bar-handle bar-handle-l";
        bar.appendChild(handleL);
        const handleR = document.createElement("span");
        handleR.className = "bar-handle bar-handle-r";
        bar.appendChild(handleR);
        attachBarDrag(bar, p, colWidth);
        grid.appendChild(bar);

        // groundbreaking marker at start of bar, only if start itself is truly in range
        if (rawStartIdx >= 0 && rawStartIdx <= totalCols-1){
          const gMarker = document.createElement("div");
          gMarker.className = "marker";
          gMarker.style.gridColumn = (rawStartIdx+2) + " / " + (rawStartIdx+3);
          gMarker.style.gridRow = String(rowNum);
          gMarker.title = p.name + " · 開工 " + formatYM(bStart);
          const dia = document.createElement("div");
          dia.className = "marker-diamond";
          gMarker.appendChild(dia);
          grid.appendChild(gMarker);
        }

        // generic open-ended "營運中" continuation — suppressed once a dedicated
        // lease bar takes over, or once a sold/other case has finished development
        if (!hasLease && !isDoneOther && rawEndIdx < totalCols-1){
          const opStart = Math.max(rawEndIdx+1, 0);
          const opBar = document.createElement("div");
          opBar.className = "bar bar-op";
          opBar.style.gridColumn = (opStart+2) + " / " + (totalCols+2);
          opBar.style.gridRow = String(rowNum);
          opBar.style.background = "var(" + modeColorVar(p.operationMode) + ")";
          opBar.title = p.name + " · 營運中（" + modeLabel(p) + " " + (p.operationProgress||0) + "%）";
          grid.appendChild(opBar);
        }
      }

      // dedicated lease bar (完成開發 + 出租 + 有填租期) — independent of the
      // construction bar's own visibility, since the lease window may sit
      // entirely inside the current view even when construction predates it
      if (hasLease && p.leaseEnd >= range.from && p.leaseStart <= range.to){
        const rawLS = bucketIndexOf(p.leaseStart);
        const rawLE = bucketIndexOf(p.leaseEnd);
        const lsIdx = Math.max(0, rawLS);
        const leIdx = Math.min(totalCols-1, rawLE);
        const leaseBar = document.createElement("div");
        leaseBar.className = "bar bar-lease";
        leaseBar.style.gridColumn = (lsIdx+2) + " / " + (leIdx+3);
        leaseBar.style.gridRow = String(rowNum);
        leaseBar.style.background = "var(" + modeColorVar(p.operationMode) + ")";
        leaseBar.title = p.name + " · 租期 " + formatDate(p.leaseStart) + " – 到期 " + formatDate(p.leaseEnd);
        if (rawLE <= totalCols-1){
          const lbl = document.createElement("span");
          lbl.className = "bar-label";
          lbl.textContent = "到期 " + formatDate(p.leaseEnd);
          leaseBar.appendChild(lbl);
        }
        const lHandleL = document.createElement("span");
        lHandleL.className = "bar-handle bar-handle-l";
        leaseBar.appendChild(lHandleL);
        const lHandleR = document.createElement("span");
        lHandleR.className = "bar-handle bar-handle-r";
        leaseBar.appendChild(lHandleR);
        attachBarDrag(leaseBar, p, colWidth, "leaseStart", "leaseEnd");
        grid.appendChild(leaseBar);
      }
    }

    const rowGroups = [
      { label: "興建中", items: visibleProjects.filter(p => p.stage !== "完成開發") },
      { label: "完成開發", items: visibleProjects.filter(p => p.stage === "完成開發") }
    ].filter(g => g.items.length);

    let rowCursor = headerRows;
    let zebraIdx = 0;
    rowGroups.forEach(g => {
      rowCursor += 1;
      const sectionRowNum = rowCursor;
      const sectionBand = document.createElement("div");
      sectionBand.className = "section-band";
      sectionBand.style.gridRow = String(sectionRowNum);
      sectionBand.style.gridColumn = "1 / -1";
      grid.appendChild(sectionBand);
      const sectionLabel = document.createElement("div");
      sectionLabel.className = "section-label";
      sectionLabel.style.gridRow = String(sectionRowNum);
      sectionLabel.style.gridColumn = "1";
      sectionLabel.textContent = g.label + "（" + g.items.length + "）";
      grid.appendChild(sectionLabel);

      g.items.forEach(p => {
        rowCursor += 1;
        renderProjectRow(p, rowCursor, zebraIdx);
        zebraIdx += 1;
      });
    });
    const totalRows = rowCursor;

    // today line
    const tk = todayKey();
    if (tk >= range.from && tk <= range.to){
      const idx = bucketIndexOf(tk);
      const line = document.createElement("div");
      line.className = "today-line";
      line.style.gridColumn = (idx+2) + " / " + (idx+3);
      line.style.gridRow = "1 / " + (totalRows+1);
      const tag = document.createElement("span");
      tag.className = "today-tag";
      tag.style.top = (24 + subHeaderH) + "px";
      tag.textContent = "今日";
      line.appendChild(tag);
      grid.appendChild(line);
    }
  }

  /* ================= cards view ================= */
  function factRow(k, v){
    const row = document.createElement("div");
    row.className = "card-fact";
    const dt = document.createElement("span");
    dt.className = "card-fact-k";
    dt.textContent = k;
    const dd = document.createElement("span");
    dd.className = "card-fact-v mono";
    dd.textContent = v;
    row.appendChild(dt);
    row.appendChild(dd);
    return row;
  }

  function renderCards(){
    const container = document.getElementById("cards-sections");
    container.innerHTML = "";
    document.getElementById("cards-count").innerHTML =
      "共 <b>" + projects.length + "</b> 個專案";

    if (!projects.length){
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "尚未建立任何專案，請點選右上角「＋ 新增專案」。";
      container.appendChild(empty);
      return;
    }

    const sorted = projects.slice().sort(byOrder);
    const devItems = sorted.filter(p => p.stage !== "完成開發");
    const doneItems = sorted.filter(p => p.stage === "完成開發");

    function buildSection(label, items){
      if (!items.length) return;
      const section = document.createElement("div");
      section.className = "card-section";
      const heading = document.createElement("div");
      heading.className = "card-section-heading";
      heading.textContent = label + "（" + items.length + "）";
      section.appendChild(heading);
      const grid = document.createElement("div");
      grid.className = "cards-grid";
      items.forEach(p => grid.appendChild(buildCard(p)));
      section.appendChild(grid);
      container.appendChild(section);
    }

    buildSection("興建中", devItems);
    buildSection("完成開發", doneItems);
  }

  function buildCard(p){
      const card = document.createElement("div");
      card.className = "card";

      const head = document.createElement("div");
      head.className = "card-head";
      const nameEl = document.createElement("div");
      nameEl.className = "card-name";
      nameEl.textContent = p.name;
      head.appendChild(nameEl);

      const badges = document.createElement("div");
      badges.className = "card-badges";
      const modeBadge = document.createElement("span");
      modeBadge.className = "badge";
      modeBadge.style.background = "var(" + modeColorVar(p.operationMode) + ")";
      modeBadge.textContent = modeLabel(p);
      badges.appendChild(modeBadge);
      const typeBadge = document.createElement("span");
      typeBadge.className = "badge-outline";
      typeBadge.textContent = typeLabel(p);
      badges.appendChild(typeBadge);
      const stageBadge = document.createElement("span");
      stageBadge.className = p.stage === "完成開發" ? "badge-stage-done" : "badge-outline";
      stageBadge.textContent = p.stage === "完成開發" ? "完成開發" : "開發期";
      badges.appendChild(stageBadge);
      head.appendChild(badges);
      card.appendChild(head);

      const facts = document.createElement("div");
      facts.className = "card-facts";
      facts.appendChild(factRow("取得建照", p.permitMonth ? formatYM(p.permitMonth) : "—"));
      facts.appendChild(factRow("興建期（開工–完工）", p.buildStart && p.buildEnd ? (formatYM(p.buildStart) + " – " + formatYM(p.buildEnd)) : "—"));
      if (p.stage === "完成開發" && p.operationMode === "出租" && p.leaseStart && p.leaseEnd){
        facts.appendChild(factRow("租期", formatDate(p.leaseStart) + " – " + formatDate(p.leaseEnd)));
        facts.appendChild(factRow("到期日", formatDate(p.leaseEnd)));
      }
      card.appendChild(facts);

      const prog = document.createElement("div");
      prog.className = "card-progress";
      const progRow = document.createElement("div");

      const l2 = document.createElement("span");
      l2.className = "mono";
      l2.textContent = (p.operationProgress||0) + "%";
      progRow.appendChild(l1);
      progRow.appendChild(l2);
      prog.appendChild(progRow);
      const track = document.createElement("div");
      track.className = "progress-track";
      const fill = document.createElement("div");
      fill.className = "progress-fill";
      fill.style.width = Math.max(0, Math.min(100, p.operationProgress||0)) + "%";
      fill.style.background = "var(" + modeColorVar(p.operationMode) + ")";
      track.appendChild(fill);
      prog.appendChild(track);
      card.appendChild(prog);

      if (p.notes){
        const notes = document.createElement("div");
        notes.className = "card-notes";
        notes.textContent = p.notes;
        card.appendChild(notes);
      }

      const actions = document.createElement("div");
      actions.className = "card-actions";

      editBtn.addEventListener("click", () => openModal(p.id));
      const delBtn = document.createElement("button");
      delBtn.className = "btn btn-ghost btn-sm btn-danger-text";
      delBtn.type = "button";
      delBtn.textContent = "刪除";
      delBtn.addEventListener("click", () => confirmDelete(p.id, delBtn));
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      card.appendChild(actions);

      return card;

  /* ================= delete confirm ================= */
  function confirmDelete(id, btnEl){
    if (pendingDeleteId === id) return;
    pendingDeleteId = id;
    const actionsRow = btnEl.parentElement;
    actionsRow.innerHTML = "";
    const label = document.createElement("span");
    label.className = "confirm-row";
    label.textContent = "確定刪除？";
    const yes = document.createElement("button");
    yes.className = "btn btn-ghost btn-sm btn-danger-text";
    yes.type = "button";
    yes.textContent = "確認";
    yes.addEventListener("click", () => { pendingDeleteId = null; removeProject(id); });
    const no = document.createElement("button");
    no.className = "btn btn-ghost btn-sm";
    no.type = "button";
    no.textContent = "取消";
    no.addEventListener("click", () => { pendingDeleteId = null; render(); });
    actionsRow.appendChild(label);
    actionsRow.appendChild(yes);
    actionsRow.appendChild(no);
  }

  /* ================= modal / form ================= */
  const overlay = document.getElementById("modal-overlay");
  const form = document.getElementById("project-form");

  function openModal(id){
    editingId = id || null;
    document.getElementById("modal-title").textContent = editingId ? "編輯專案" : "新增專案";
    document.getElementById("err-name").textContent = "";
    document.getElementById("err-range").textContent = "";

    const p = editingId ? projects.find(x => x.id === editingId) : null;

    document.getElementById("f-name").value = p ? p.name : "";
    document.getElementById("f-type").value = p && ["廠辦","住宅","商辦","廠房","社宅"].includes(p.type) ? p.type : (p ? "其他" : "廠辦");
    document.getElementById("f-type-other").value = p && p.type === "其他" ? (p.typeOther||"") : "";
    document.getElementById("f-stage").value = p && p.stage === "完成開發" ? "完成開發" : "開發期";
    document.getElementById("f-permit").value = p ? (p.permitMonth||"") : "";
    document.getElementById("f-start").value = p ? p.buildStart : "";
    document.getElementById("f-end").value = p ? p.buildEnd : "";
    document.getElementById("f-mode").value = p && ["出售","出租","自營"].includes(p.operationMode) ? p.operationMode : (p ? "其他" : "出售");
    document.getElementById("f-mode-other").value = p && p.operationMode === "其他" ? (p.operationModeOther||"") : "";
    document.getElementById("f-lease-start").value = p ? (p.leaseStart||"") : "";
    document.getElementById("f-lease-end").value = p ? (p.leaseEnd||"") : "";
    document.getElementById("err-lease").textContent = "";
    document.getElementById("f-progress").value = p ? (p.operationProgress||0) : 0;
    document.getElementById("f-progress-value").textContent = (p ? (p.operationProgress||0) : 0) + "%";
    document.getElementById("f-notes").value = p ? (p.notes||"") : "";

    toggleOther("f-type", "wrap-type-other");
    toggleOther("f-mode", "wrap-mode-other");
    updateProgressLabel();
    updateLeaseVisibility();
    updateBuildRequirement();

    overlay.classList.add("show");
    document.getElementById("f-name").focus();
  }
  function closeModal(){
    overlay.classList.remove("show");
    editingId = null;
  }
  function toggleOther(selectId, wrapId){
    const sel = document.getElementById(selectId);
    document.getElementById(wrapId).style.display = sel.value === "其他" ? "flex" : "none";
  }
  function updateProgressLabel(){
    document.getElementById("progress-label").textContent = progressLabelFor(document.getElementById("f-mode").value);
  }
  function updateLeaseVisibility(){
    const show = document.getElementById("f-stage").value === "完成開發" && document.getElementById("f-mode").value === "出租";
    document.getElementById("wrap-lease").style.display = show ? "flex" : "none";
  }
  function updateBuildRequirement(){
    const isDone = document.getElementById("f-stage").value === "完成開發";
    document.getElementById("label-start").textContent = "興建期起（開工）" + (isDone ? "" : " *");
    document.getElementById("label-end").textContent = "興建期迄" + (isDone ? "" : " *");
    document.getElementById("hint-build").style.display = isDone ? "block" : "none";
  }

  document.getElementById("f-type").addEventListener("change", () => toggleOther("f-type","wrap-type-other"));
  document.getElementById("f-mode").addEventListener("change", () => { toggleOther("f-mode","wrap-mode-other"); updateProgressLabel(); updateLeaseVisibility(); });
  document.getElementById("f-stage").addEventListener("change", () => { updateLeaseVisibility(); updateBuildRequirement(); });
  document.getElementById("f-progress").addEventListener("input", e => {
    document.getElementById("f-progress-value").textContent = e.target.value + "%";
  });
  document.getElementById("btn-today-start").addEventListener("click", () => {
    document.getElementById("f-start").value = todayKey();
  });
  document.getElementById("btn-today-lease").addEventListener("click", () => {
    document.getElementById("f-lease-start").value = todayDateKey();
  });
  document.getElementById("btn-add").addEventListener("click", () => openModal(null));
  document.getElementById("btn-cancel").addEventListener("click", closeModal);
  overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && overlay.classList.contains("show")) closeModal(); });

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const name = document.getElementById("f-name").value.trim();
    const start = document.getElementById("f-start").value;
    const end = document.getElementById("f-end").value;
    const stage = document.getElementById("f-stage").value;
    const mode = document.getElementById("f-mode").value;
    const leaseStart = document.getElementById("f-lease-start").value;
    const leaseEnd = document.getElementById("f-lease-end").value;
    document.getElementById("err-name").textContent = "";
    document.getElementById("err-range").textContent = "";
    document.getElementById("err-lease").textContent = "";

    let ok = true;
    if (!name){ document.getElementById("err-name").textContent = "請輸入案名。"; ok = false; }
    if (stage === "開發期" && (!start || !end)){
      document.getElementById("err-range").textContent = "請輸入興建期起訖。";
      ok = false;
    } else if (start && end && end < start){
      document.getElementById("err-range").textContent = "興建期迄不可早於興建期起。";
      ok = false;
    }
    if (stage === "完成開發" && mode === "出租" && leaseStart && leaseEnd && leaseEnd < leaseStart){
      document.getElementById("err-lease").textContent = "到期日不可早於出租起始日。";
      ok = false;
    }
    if (!ok) return;

    const type = document.getElementById("f-type").value;
    const data = {
      name,
      type,
      typeOther: type === "其他" ? document.getElementById("f-type-other").value.trim() : "",
      stage,
      permitMonth: document.getElementById("f-permit").value || "",
      buildStart: start,
      buildEnd: end,
      operationMode: mode,
      operationModeOther: mode === "其他" ? document.getElementById("f-mode-other").value.trim() : "",
      leaseStart: stage === "完成開發" && mode === "出租" ? leaseStart : "",
      leaseEnd: stage === "完成開發" && mode === "出租" ? leaseEnd : "",
      operationProgress: Number(document.getElementById("f-progress").value) || 0,
      notes: document.getElementById("f-notes").value.trim()
    };

    const btn = document.getElementById("btn-save");
    btn.disabled = true;
    try{
      if (editingId){ await saveProject(editingId, data); }
      else { data.order = Date.now(); await createProject(data); }
      closeModal();
    }catch(err){
      console.error(err);
      document.getElementById("err-name").textContent = "儲存失敗，請稍後再試。";
    }finally{
      btn.disabled = false;
    }
  });

  /* ================= range controls ================= */
  document.getElementById("range-from").addEventListener("change", e => {
    range.from = e.target.value || range.from;
    highlightPreset(null);
    renderGantt();
  });
  document.getElementById("range-to").addEventListener("change", e => {
    range.to = e.target.value || range.to;
    highlightPreset(null);
    renderGantt();
  });
  document.getElementById("preset-row").addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    applyPreset(btn.dataset.preset);
  });
  document.getElementById("granularity-row").addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    granularity = btn.dataset.granularity;
    document.querySelectorAll("#granularity-row .chip").forEach(c => {
      c.classList.toggle("active", c === btn);
    });
    renderGantt();
  });

  /* ================= boot ================= */
  initStorage();
})();
</script>
</body>
</html>
